<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1550" viewBox="0 0 1800 1550" role="img" aria-labelledby="title desc">
<title id="title">Milky Way 2.0 implemented architecture</title>
<desc id="desc">A local React interface connects through FastAPI and bounded jobs to one LangGraph Retail Agent and the OpenAI Responses API. Twenty-seven tools access context, SQLite memory and read-only DuckDB. Measured evidence is validated, rendered and saved atomically.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b40}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#536478}.label{font-size:16px;letter-spacing:1.3px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#536478}.edge{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style>
<rect width="1800" height="1550" fill="#f5f7fb"/>
<text x="55" y="52" class="title">Milky Way 2.0 · Implemented system architecture</text>
<text x="55" y="83" class="subtitle">One Retail Agent · 27 tools · versioned domain workspace · isolated evaluations · measured evidence</text>
<rect x="45" y="108" width="1280" height="1325" rx="22" fill="#ffffff" stroke="#ccd8e4" stroke-width="2"/>
<text x="70" y="136" class="label" fill="#42627b">TRUSTED LOCAL MACHINE · SINGLE USER · PORT 8766</text>

<rect x="80" y="155" width="1210" height="95" rx="14" fill="#edf5ff" stroke="#9dbce0" stroke-width="1.6"/>
<text x="100" y="187" class="heading">React chat + Improve workspace</text>
<text x="100" y="220" class="body">Chat + shared controls · Deferred admin modules · Knowledge · Skills · Answer design · Evaluations · Releases</text>
<rect x="80" y="315" width="350" height="135" rx="14" fill="#eef4fa" stroke="#ccd8e4" stroke-width="1.6"/>
<text x="100" y="347" class="heading">FastAPI application</text>
<text x="100" y="380" class="body">Bounded HTTP intake; local controls</text>
<text x="100" y="407" class="body">Chat / jobs / history / investigation</text>
<text x="100" y="434" class="body">API and public guide references</text>
<rect x="475" y="315" width="345" height="135" rx="14" fill="#eef4fa" stroke="#ccd8e4" stroke-width="1.6"/>
<text x="495" y="347" class="heading">Bounded job execution</text>
<text x="495" y="380" class="body">2 chat workers + 1 evaluation worker</text>
<text x="495" y="407" class="body">Stop / Retry; bounded job deadlines</text>
<text x="495" y="434" class="body">Frozen release; revision-checked saves</text>
<rect x="870" y="315" width="420" height="135" rx="14" fill="#e7f0ff" stroke="#7f9fcc" stroke-width="1.6"/>
<text x="890" y="347" class="heading">One Retail Agent</text>
<text x="890" y="380" class="body">LangGraph: agent ↔ tools loop</text>
<text x="890" y="407" class="body">Plan scope → inspect → query → correct</text>
<text x="890" y="434" class="body">Explanation / analysis / investigation</text>
<rect x="1415" y="315" width="330" height="135" rx="14" fill="#f4edff" stroke="#b6a0d1" stroke-width="1.6"/>
<text x="1435" y="347" class="heading">OpenAI Responses API</text>
<text x="1435" y="380" class="body">Configured model; HTTPS</text>
<text x="1435" y="407" class="body">Bounded context / evidence preview</text>
<text x="1435" y="434" class="body">Key held by local backend</text>
<rect x="80" y="555" width="350" height="330" rx="14" fill="#f0f8f5" stroke="#9ac3b4" stroke-width="1.6"/>
<text x="100" y="583" class="label">REFERENCE KNOWLEDGE</text>
<text x="100" y="617" class="heading">Frozen context snapshots</text>
<text x="100" y="650" class="body">26 imported baseline documents</text>
<text x="100" y="677" class="body">Published ontology + knowledge</text>
<text x="100" y="704" class="body">19 stable-ID skills + custom methods</text>
<text x="100" y="731" class="body">3 profiles + versioned examples</text>
<text x="100" y="758" class="body">Original source bodies and hashes</text>
<text x="100" y="785" class="body">Lexical, section-aware retrieval</text>
<text x="100" y="812" class="body">D# references with exact version</text>
<text x="100" y="839" class="body">Evaluation goldens excluded</text>
<rect x="475" y="555" width="345" height="330" rx="14" fill="#edf4ff" stroke="#a2bad9" stroke-width="1.6"/>
<text x="495" y="583" class="label">ACTIVE CAPABILITIES</text>
<text x="495" y="617" class="heading">27 registered tools</text>
<text x="495" y="650" class="body">6 context / inspection interfaces</text>
<text x="495" y="677" class="body">5 query / analysis interfaces</text>
<text x="495" y="704" class="body">10 investigation / test interfaces</text>
<text x="495" y="731" class="body">1 scope-planning interface</text>
<text x="495" y="758" class="body">2 memory interfaces</text>
<text x="495" y="785" class="body">3 visual / answer interfaces</text>
<text x="495" y="812" class="body">Validated scope and SQL boundaries</text>
<text x="495" y="839" class="body">Allowlist + strict argument contracts</text>
<rect x="870" y="555" width="420" height="330" rx="14" fill="#fff7e9" stroke="#d9bf8f" stroke-width="1.6"/>
<text x="890" y="583" class="label">PERSISTENT LOCAL STATE</text>
<text x="890" y="617" class="heading">SQLite state and memory</text>
<text x="890" y="650" class="body">Chats, answers and explicit memories</text>
<text x="890" y="677" class="body">Session scope + investigation state</text>
<text x="890" y="704" class="body">Mutable drafts with revision checks</text>
<text x="890" y="731" class="body">Immutable asset versions + releases</text>
<text x="890" y="758" class="body">Active pointer + activation history</text>
<text x="890" y="785" class="body">Structured feedback and regressions</text>
<text x="890" y="812" class="body">Evaluation outputs + review records</text>
<text x="890" y="839" class="body">No automatic training or full recall</text>
<rect x="80" y="995" width="350" height="140" rx="14" fill="#f0f8f5" stroke="#9ac3b4" stroke-width="1.6"/>
<text x="100" y="1027" class="heading">Read-only DuckDB</text>
<text x="100" y="1060" class="body">23 tables · 5 million transactions</text>
<text x="100" y="1087" class="body">10.995 million merchandise lines</text>
<text x="100" y="1114" class="body">Synthetic data + Parquet exports</text>
<rect x="475" y="995" width="345" height="140" rx="14" fill="#edf4ff" stroke="#a2bad9" stroke-width="1.6"/>
<text x="495" y="1027" class="heading">Evidence and presentation</text>
<text x="495" y="1060" class="body">E# rows + SQL + parameters + scope</text>
<text x="495" y="1087" class="body">Measured values and chart checks</text>
<text x="495" y="1114" class="body">Profile display; evidence preserved</text>
<rect x="870" y="995" width="420" height="140" rx="14" fill="#fff7e9" stroke="#d9bf8f" stroke-width="1.6"/>
<text x="890" y="1027" class="heading">Atomic answer completion</text>
<text x="890" y="1060" class="body">Save answer + message + job result</text>
<text x="890" y="1087" class="body">Reject obsolete scope / investigation</text>
<text x="890" y="1114" class="body">Record release, skill, profile, sources</text>
<path d="M255 250 V315" class="edge"/>
<text x="274" y="288" class="small">HTTP and job polling</text>
<path d="M430 382 H475" class="edge"/>
<path d="M820 382 H870" class="edge"/>
<path d="M1290 382 H1415" class="edge both"/>
<text x="1337" y="365" class="small">HTTPS</text>
<path d="M920 450 C920 500 750 495 750 555" class="edge both"/>
<text x="742" y="491" class="small">tool calls / results</text>
<path d="M430 708 H475" class="edge both"/>
<path d="M820 708 H870" class="edge both"/>
<path d="M550 885 V936 H255 V995" class="edge"/>
<text x="98" y="925" class="small">Bound dates, filters and query limits</text>
<path d="M430 1062 H475" class="edge"/>
<path d="M650 995 V885" class="edge"/>
<text x="670" y="944" class="small">measured results</text>
<path d="M820 1062 H870" class="edge"/>
<path d="M1080 995 V885" class="edge both"/>
<text x="1100" y="944" class="small">persistent records</text>
<rect x="1390" y="505" width="380" height="590" rx="18" fill="#ffffff" stroke="#ccd8e4"/>
<text x="1410" y="535" class="label">SAME LOCAL APP PROCESS</text>
<rect x="1415" y="555" width="330" height="230" rx="14" fill="#f0f8f5" stroke="#9ac3b4" stroke-width="1.6"/>
<text x="1435" y="587" class="heading">Evaluation workbench</text>
<text x="1435" y="620" class="body">Frozen baseline vs candidate</text>
<text x="1435" y="647" class="body">76 bundled runtime contracts</text>
<text x="1435" y="674" class="body">Temporary conversation / memories</text>
<text x="1435" y="701" class="body">Separate bounded worker + queue</text>
<text x="1435" y="728" class="body">Optional live calls require consent</text>
<text x="1435" y="755" class="body">Persist outputs, limits and review</text>
<rect x="1415" y="825" width="330" height="230" rx="14" fill="#ffffff" stroke="#ccd8e4" stroke-width="1.6"/>
<text x="1435" y="857" class="heading">Meaningful boundaries</text>
<text x="1435" y="890" class="body">Local operator; no login roles</text>
<text x="1435" y="917" class="body">Methods use approved tools only</text>
<text x="1435" y="944" class="body">Untrusted context stays in input</text>
<text x="1435" y="971" class="body">Deterministic pass is not semantic QA</text>
<text x="1435" y="998" class="body">No model judge or causal proof</text>
<text x="1435" y="1025" class="body">No external ingestion / tenancy</text>
<text x="80" y="1160" class="small">Generation is offline; warehouse access stays read-only. Evaluation expectations never become answer context.</text>
<rect x="80" y="1230" width="350" height="160" rx="14" fill="#edf5ff" stroke="#9dbce0" stroke-width="1.6"/>
<text x="100" y="1262" class="heading">1. Author and preview</text>
<text x="100" y="1295" class="body">Save drafts with expected revision</text>
<text x="100" y="1322" class="body">Check mappings and dependencies</text>
<text x="100" y="1349" class="body">Preview sources and measured output</text>
<text x="100" y="1376" class="body">Freeze an immutable candidate</text>
<rect x="475" y="1230" width="345" height="160" rx="14" fill="#f0f8f5" stroke="#9ac3b4" stroke-width="1.6"/>
<text x="495" y="1262" class="heading">2. Evaluate and review</text>
<text x="495" y="1295" class="body">Run complete core + custom checks</text>
<text x="495" y="1322" class="body">Inspect changes, failures, coverage</text>
<text x="495" y="1349" class="body">Record reviewer and rationale</text>
<text x="495" y="1376" class="body">Failed hard checks block release</text>
<rect x="870" y="1230" width="420" height="160" rx="14" fill="#fff7e9" stroke="#d9bf8f" stroke-width="1.6"/>
<text x="890" y="1262" class="heading">3. Publish or restore</text>
<text x="890" y="1295" class="body">Recheck candidate and runtime hashes</text>
<text x="890" y="1322" class="body">Atomically switch active release</text>
<text x="890" y="1349" class="body">Next answer captures new snapshot</text>
<text x="890" y="1376" class="body">Earlier answers keep their provenance</text>
<path d="M430 1310 H475" class="edge"/>
<path d="M820 1310 H870" class="edge"/>
<text x="55" y="1480" class="small">Milky Way 2.0 · Application release 2.1.1 · Implemented September 26, 2026</text>
<text x="55" y="1510" class="small">User/admin guide, low-level design, complete feature status, data summary and release evidence: retail_app/docs/developer/</text>
</svg>