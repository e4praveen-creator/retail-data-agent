services:
  retail-app:
    build:
      context: ..
      dockerfile: retail_app/Dockerfile
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - ../retail_data/data/full:/workspace/retail_data/data/full:ro
      - milkyway2-state:/workspace/retail_app/state
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 3g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  milkyway2-state:
