services:
  generator:
    build: .
    profiles: [tools]
    volumes:
      - ./data:/app/data
    command: [python, src/generate.py, --output, data/full]
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      RETAIL_DATA_DIR: /app/data/full
    command: [uvicorn, api:app, --app-dir, src, --host, 0.0.0.0, --port, "8000", --workers, "1"]
